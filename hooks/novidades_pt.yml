# Traduções para português dos títulos de PR e das mensagens de commit que
# entraram no histórico em inglês. O hook novidades.py usa estas versões nas
# páginas em português; as páginas em inglês mostram o texto original do git.
#
# prs: número do PR -> título (sem o prefixo convencional)
# commits: SHA curto (7 caracteres) -> mensagem (sem o prefixo convencional;
#          o tipo e o escopo continuam vindo do commit original)
#
# Commits e títulos de PR novos devem ser escritos em português; esta tabela
# só existe para o histórico antigo.

