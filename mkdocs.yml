# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Portal ATC
site_description: Informações e recursos para controladores na Vatsim Brasil.
site_url: https://atc.vatsim.com.br
repo_name: vatsim-brasil/atc-docs
repo_url: https://github.com/vatsim-brasil/atc-docs

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  logo: images/vatbrz-branca.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: "Ubuntu Sans"
    code: "Ubuntu Mono"
  palette:
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mudar para o tema claro

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Mudar para o tema escuro

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - social
    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - footnotes
  - md_in_html
  - meta
  - sane_lists
  - tables
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - "includes/abreviacoes.md"
      url_download: true
  - toc:
      toc_depth: 2

extra:
  # Token público do Mapbox (pk.*). Restrinja por URL no painel do Mapbox.
  mapbox_token: !ENV [MAPBOX_ACCESS_TOKEN, ""]
  # Estilos do Mapbox (usuario/id). Aceita estilos próprios do Mapbox Studio.
  mapbox_estilos:
    claro: mapbox/outdoors-v12
    escuro: mapbox/navigation-night-v1
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@VATSIMBrasil
      name: YouTube
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/vatsimbrasil/
      name: Instagram
    - icon: fontawesome/brands/discord
      link: https://community.vatsim.net/
      name: Discord

extra_javascript:
  - javascripts/katex.js
  - javascripts/metar.js
  - javascripts/tma-meteo.js
  - javascripts/pdf-embed.js
  - javascripts/home.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js

extra_css:
  - stylesheets/extra.css
  # theme.css vem por último para prevalecer sobre os estilos legados
  - stylesheets/theme.css
  - https://unpkg.com/katex@0/dist/katex.min.css
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css

plugins:
  - search:
      lang:
        - en
        - pt
  - awesome-pages
  - glightbox
  - table-reader
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - build: true
          default: true
          locale: pt
          name: Português
          copyright: O conteúdo deste site deve ser utilizado apenas em um ambiente de simulação de voo.
          site_name: Portal ATC
        - build: true
          default: false
          locale: en
          name: English
          copyright: The content on this website is intended for Flight Simulation use only.
          site_name: ATC Portal
          nav_translations:
            Aeródromos: Aerodromes
            Atlântico: Oceanic
            Centros: Centers
            Controlados: Controlled
            Documentos: Documents
            Especiais: Special
            Eventos Antigos: Past Events
            Fundamentos: Fundamentals
            Manuais: Manuals
            Manuais Operacionais: Operational Manuals
            Manual de Circuito de Tráfego: Traffic Circuit Manual
            Manual de Espaço Aéreo e Serviços ATS: Airspace and ATS Services Manual
            Manual de Fraseologia Aeronáutica: Aeronautical Phraseology Manual
            Manual de Fraseologia para Voo Visual: VFR Phraseology Manual
            Manual de Meteorologia Aeronáutica: Aeronautical Meteorology Manual
            Manual de Plano de Voo: Flight Plan Manual
            Não Controlados: Uncontrolled
            Novidades: What's New
            Piloto: Pilot
            Terminais: Terminals
      reconfigure_material: true
      reconfigure_search: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: pt
  - minify:
      minify_html: true

validation:
  unrecognized_links: ignore

hooks:
  - hooks/novidades.py

watch:
  - includes
  - overrides
  - hooks