<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Ubuntu, 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd54f"/>
    </marker>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#262c33"/>
  <text x="20" y="30" fill="#eceff1" font-size="15" font-weight="bold">Sequência na perna do vento ("trombone")</text>
  <text x="20" y="50" fill="#90a4ae" font-size="12">Quanto mais tarde a curva para a base, mais longa a trajetória e maior o espaçamento.</text>
  <!-- pista e curso final -->
  <rect x="40" y="315" width="50" height="10" fill="#cfd8dc"/>
  <line x1="90" y1="320" x2="780" y2="320" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="10 6"/>
  <path d="M270,310 L278,324 L262,324 z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="270" y="345" fill="#ffffff" font-size="12" text-anchor="middle">FAP</text>
  <!-- perna do vento -->
  <line x1="120" y1="140" x2="760" y2="140" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- bases possíveis -->
  <g stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#s2)">
    <path d="M460,140 L460,240 L380,316"/>
    <path d="M580,140 L580,240 L500,316"/>
    <path d="M700,140 L700,240 L620,316"/>
  </g>
  <g fill="#90a4ae" font-size="11" text-anchor="middle">
    <text x="460" y="128">base cedo</text><text x="580" y="128">base normal</text><text x="700" y="128">base tarde</text>
  </g>
  <!-- aeronave nº1 na final -->
  <g transform="translate(330,320)"><circle r="6" fill="#ffd54f"/></g>
  <text x="348" y="350" fill="#ffd54f" font-size="12" text-anchor="middle">Nº 1, A320, 160 kt</text>
  <!-- aeronave nº2 no vetor de interceptação -->
  <g transform="translate(520,270)"><circle r="6" fill="#ffd54f"/></g>
  <text x="532" y="266" fill="#ffd54f" font-size="12">Nº 2</text>
  <path d="M520,270 L470,316" stroke="#ffd54f" stroke-width="2.5" fill="none" marker-end="url(#s1)"/>
  <text x="520" y="350" fill="#ffd54f" font-size="12" text-anchor="middle">Nº 2, B77W, 180 kt</text>
  <text x="520" y="366" fill="#90a4ae" font-size="11" text-anchor="middle">6+ NM atrás do Nº 1</text>
  <!-- aeronave nº3 na perna do vento, esticada -->
  <g transform="translate(640,140)"><circle r="6" fill="#ffd54f"/></g>
  <path d="M640,140 L700,140" stroke="#ffd54f" stroke-width="2.5" fill="none" marker-end="url(#s1)"/>
  <text x="640" y="96" fill="#ffd54f" font-size="12" text-anchor="middle">Nº 3, A320, 210 kt</text>
  <text x="640" y="112" fill="#90a4ae" font-size="11" text-anchor="middle">atrás de pesada: 5 NM + margem</text>
  <!-- aeronave nº4 entrando na perna do vento -->
  <g transform="translate(200,140)"><circle r="6" fill="#ffd54f"/></g>
  <path d="M200,140 L260,140" stroke="#ffd54f" stroke-width="2.5" fill="none" marker-end="url(#s1)"/>
  <text x="200" y="170" fill="#ffd54f" font-size="12" text-anchor="middle">Nº 4, E195, 250 kt</text>
  <text x="200" y="186" fill="#90a4ae" font-size="11" text-anchor="middle">descendo na perna do vento</text>
</svg>
