  <g font-size="12">
    <rect x="0" y="540" width="1000" height="18" fill="#105f4f"/>
    <text x="10" y="553" fill="#fff">[ATC]&#160;&#160;[SBCT_APP]&#160;&#160;[AZU4512]&#160;&#160;[SBCW_CTR]</text>
    <text x="10" y="574" fill="#ddd">[12:30:41]&#160;SBCW_CTR:&#160;AZU4512&#160;descendo&#160;FL110,&#160;livre&#160;STAR</text>
