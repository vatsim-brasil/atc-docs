    <rect x="828" y="400" width="164" height="16" fill="#3d7994"/>
    <text x="852" y="412" fill="#fff">AZU4512</text>
    <text x="834" y="434" fill="#fff">A20N&#160;&#160;M&#160;&#160;SBGR-SBCT</text>
    <text x="834" y="450" fill="#fff">RFL&#160;330&#160;&#160;SQ&#160;4512</text>
    <text x="834" y="466" fill="#fff">STAR&#160;&#160;NIBR1A</text>
