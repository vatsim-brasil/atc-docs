<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="white-space:pre" width="1000" height="600" viewBox="0 0 1000 600" font-family="Consolas, 'Ubuntu Mono', 'DejaVu Sans Mono', monospace">
  <defs>
