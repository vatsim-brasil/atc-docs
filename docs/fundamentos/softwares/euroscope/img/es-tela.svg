    <text x="128" y="17" font-size="9">OPEN</text>
    <text x="128" y="31" font-size="13" font-weight="bold">SCT</text>
    <text x="162" y="27" font-size="16">NEW</text>
    <text x="215" y="25" font-size="12">SBCT&#160;081200Z&#160;09008KT&#160;9999&#160;FEW030&#160;22/15&#160;Q1018</text>
    <text x="640" y="27" font-size="18">12:31:59</text>
    <text x="745" y="17" font-size="9">OTHER</text>
    <text x="745" y="31" font-size="13" font-weight="bold">SET</text>
    <text x="790" y="17" font-size="9">QUICK</text>
    <text x="790" y="31" font-size="13" font-weight="bold">SET</text>
    <text x="900" y="27" font-size="16">5</text>
    <text x="925" y="27" font-size="16" font-weight="bold">NM</text>
  </g>

