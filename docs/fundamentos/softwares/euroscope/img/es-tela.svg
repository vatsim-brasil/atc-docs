      <line x1="-5" y1="5" x2="-28" y2="22" stroke="#000" stroke-dasharray="3 2"/>
      <line x1="5" y1="5" x2="22" y2="22" stroke="#000"/>
      <text x="26" y="32" fill="#000">AZU4512</text>
