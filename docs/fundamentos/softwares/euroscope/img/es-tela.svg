  <!-- active sector -->
  <polygon points="430,120 640,95 800,180 820,380 700,500 470,520 360,400 350,220" fill="#868686" stroke="#ffffff" stroke-width="2.5"/>

  <!-- airways / procedures -->
  <g stroke-width="1.2" fill="none">
    <path d="M250,560 L540,330 L960,120" stroke="#00ff40" stroke-dasharray="6 4"/>
    <path d="M300,90 L560,320 L900,560" stroke="#ffff00" stroke-dasharray="6 4"/>
    <path d="M940,300 L560,330" stroke="#55d7ff"/>
    <path d="M520,580 L560,335" stroke="#ff9e55" stroke-dasharray="4 4"/>
  </g>
  <!-- runway + range rings -->
