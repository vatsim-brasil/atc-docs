    <text x="896" y="62" fill="#ddd">ATC</text>
    <text x="834" y="82" fill="#ffff00">CT&#160;&#160;SBCT_APP</text>
    <text x="834" y="98" fill="#fff">T&#160;&#160;&#160;SBCT_TWR</text>
    <text x="834" y="114" fill="#fff">G&#160;&#160;&#160;SBCT_GND</text>
    <text x="834" y="130" fill="#fff">CW&#160;&#160;SBCW_CTR</text>
