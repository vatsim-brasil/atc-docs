    <text x="14" y="96" fill="#fff">GLO1890&#160;&#160;1241&#160;SBGR&#160;&#160;&#160;&#160;&#160;&#160;240</text>
    <text x="14" y="112" fill="#fff">AZU2870&#160;&#160;1250&#160;SBPA&#160;&#160;&#160;&#160;&#160;&#160;330</text>

    <rect x="8" y="136" width="250" height="62" fill="#0b4136" opacity="0.95"/>
    <rect x="8" y="136" width="250" height="16" fill="#105f4f"/>
    <text x="78" y="148" fill="#ddd">Sector&#160;Exit&#160;List</text>
    <text x="14" y="166" fill="#fff">C/S&#160;&#160;&#160;&#160;&#160;&#160;COPX&#160;&#160;ADES&#160;ETA</text>
    <text x="14" y="182" fill="#fff">TAM3324&#160;&#160;NIBRU&#160;SBFL&#160;1238</text>

    <rect x="8" y="206" width="250" height="78" fill="#0b4136" opacity="0.95"/>
    <rect x="8" y="206" width="250" height="16" fill="#105f4f"/>
    <text x="84" y="218" fill="#ddd">Departure&#160;List</text>
    <text x="14" y="236" fill="#fff">C/S&#160;&#160;&#160;&#160;&#160;ADES&#160;RWY&#160;SID&#160;&#160;&#160;ST</text>
    <text x="14" y="252" fill="#fff">AZU4100&#160;SBKP&#160;15&#160;&#160;GERT1&#160;TAXI</text>
    <text x="14" y="268" fill="#fff">GLO1122&#160;SBGR&#160;15&#160;&#160;GERT1&#160;PUSH</text>
