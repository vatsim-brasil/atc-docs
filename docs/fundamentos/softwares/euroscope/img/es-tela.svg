  </g>

  <!-- markers -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <g transform="translate(112,22)"><use href="#mk"/><text y="5">1</text></g>
    <g transform="translate(600,22)"><use href="#mk"/><text y="5">2</text></g>
    <g transform="translate(270,62)"><use href="#mk"/><text y="5">3</text></g>
    <g transform="translate(560,470)"><use href="#mk"/><text y="5">4</text></g>
    <g transform="translate(814,62)"><use href="#mk"/><text y="5">5</text></g>
    <g transform="translate(814,412)"><use href="#mk"/><text y="5">6</text></g>
    <g transform="translate(980,575)"><use href="#mk"/><text y="5">7</text></g>
